version: "3.9"

# Production overrides – use: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
services:
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120

  celery_worker:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

  celery_beat:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
