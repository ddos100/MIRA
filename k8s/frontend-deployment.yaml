apiVersion: apps/v1
kind: Deployment
metadata:
  name: mira-frontend
  namespace: mira
  labels:
    app: mira-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mira-frontend
  template:
    metadata:
      labels:
        app: mira-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/mira-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mira-frontend
  namespace: mira
spec:
  selector:
    app: mira-frontend
  ports:
    - port: 80
      targetPort: 80
