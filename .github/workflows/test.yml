name: CI

on:
  push:
    branches: ["main", "master", "claude/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend:
    name: Backend (Python / Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mira_test
          POSTGRES_USER: mira
          POSTGRES_PASSWORD: mira
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements/development.txt

      - name: Lint (flake8)
        run: flake8 backend/ --config=backend/.flake8

      - name: Format check (black)
        run: black --check backend/

      - name: Import order (isort)
        run: isort --check-only backend/

      - name: Run migrations check
        env:
          DATABASE_URL: postgres://mira:mira@localhost:5432/mira_test
          SECRET_KEY: ci-secret-key
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          cd backend
          python manage.py migrate --check

      - name: Run tests
        env:
          DATABASE_URL: postgres://mira:mira@localhost:5432/mira_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          cd backend
          pytest --cov=apps --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend

  frontend:
    name: Frontend (Node / React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint (eslint)
        run: npm run lint
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Run tests
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
