name: Build & Deploy

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository_owner }}/mira-backend
  IMAGE_FRONTEND: ${{ github.repository_owner }}/mira-frontend

jobs:
  # ─── Build & push Docker images ──────────────────────────────────────────────
  build:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      backend_tag: ${{ steps.meta-backend.outputs.tags }}
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}
      version: ${{ steps.meta-backend.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata – backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Docker metadata – frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to staging ───────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.14.0"

      - name: Add Bitnami repo
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Deploy via Helm (staging)
        run: |
          helm upgrade --install mira-staging helm/mira/ \
            --namespace mira-staging \
            --create-namespace \
            --set image.backend.repository=${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }} \
            --set image.backend.tag=${{ needs.build.outputs.version }} \
            --set image.frontend.repository=${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }} \
            --set image.frontend.tag=${{ needs.build.outputs.version }} \
            --set backend.secretKey="${{ secrets.STAGING_SECRET_KEY }}" \
            --set backend.allowedHosts="${{ vars.STAGING_HOST }}" \
            --set backend.corsAllowedOrigins="https://${{ vars.STAGING_HOST }}" \
            --set ingress.host="${{ vars.STAGING_HOST }}" \
            --set postgresql.auth.password="${{ secrets.STAGING_DB_PASSWORD }}" \
            --set email.host="${{ vars.EMAIL_HOST }}" \
            --set email.user="${{ secrets.EMAIL_USER }}" \
            --set email.password="${{ secrets.EMAIL_PASSWORD }}" \
            --wait --timeout=10m

      - name: Run migrations (staging)
        run: |
          kubectl -n mira-staging exec -it \
            $(kubectl -n mira-staging get pod -l app.kubernetes.io/component=backend -o name | head -1) \
            -- python manage.py migrate --noinput

  # ─── Deploy to production ────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to production
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.14.0"

      - name: Add Bitnami repo
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Deploy via Helm (production)
        run: |
          helm upgrade --install mira helm/mira/ \
            --namespace mira \
            --create-namespace \
            --set image.backend.repository=${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }} \
            --set image.backend.tag=${{ needs.build.outputs.version }} \
            --set image.frontend.repository=${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }} \
            --set image.frontend.tag=${{ needs.build.outputs.version }} \
            --set backend.secretKey="${{ secrets.PRODUCTION_SECRET_KEY }}" \
            --set backend.allowedHosts="${{ vars.PRODUCTION_HOST }}" \
            --set backend.corsAllowedOrigins="https://${{ vars.PRODUCTION_HOST }}" \
            --set ingress.host="${{ vars.PRODUCTION_HOST }}" \
            --set postgresql.auth.password="${{ secrets.PRODUCTION_DB_PASSWORD }}" \
            --set email.host="${{ vars.EMAIL_HOST }}" \
            --set email.user="${{ secrets.EMAIL_USER }}" \
            --set email.password="${{ secrets.EMAIL_PASSWORD }}" \
            --set replicaCount.backend=3 \
            --set replicaCount.celeryWorker=2 \
            --wait --timeout=15m

      - name: Run migrations (production)
        run: |
          kubectl -n mira exec -it \
            $(kubectl -n mira get pod -l app.kubernetes.io/component=backend -o name | head -1) \
            -- python manage.py migrate --noinput

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
