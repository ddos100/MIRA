apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mira.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mira.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      {{- include "mira.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "mira.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            {{- include "mira.envFrom" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/core/health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/core/health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          volumeMounts:
            - name: media
              mountPath: /app/mediafiles
      volumes:
        - name: media
          {{- if .Values.persistence.media.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mira.fullname" . }}-media
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mira.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mira.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mira.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - port: 8000
      targetPort: 8000
