apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mira-ingress
  namespace: mira
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mira.example.com
      secretName: mira-tls
  rules:
    - host: mira.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mira-backend
                port:
                  number: 8000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: mira-backend
                port:
                  number: 8000
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: mira-backend
                port:
                  number: 8000
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: mira-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mira-frontend
                port:
                  number: 80
